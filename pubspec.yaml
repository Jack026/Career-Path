name: Career_Path
description: "A Career Recommendation app power by hackabytes"


publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.5.0
  firebase_auth: ^5.3.0
  google_sign_in: ^6.2.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0


  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/loo.png
    - assets/login.png
    - assets/google.png
    - assets/adtu.png
    - assets/stanford.png
    - assets/mit.png
    - assets/iisc.png
    - assets/iit_bombay.png
    - assets/appstore.png

  

  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/appstore.png" # Specify the path to your logo image
  web: true
  windows: true


  
  
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
