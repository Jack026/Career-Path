plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin" // Make sure the Flutter plugin is applied after Android and Kotlin plugins
}

android {
    namespace = "com.hackabytes.careerpath.main"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.hackabytes.careerpath.main"
        minSdkVersion 23 // Updated to 23 to meet firebase_auth requirement
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' // Ensure to specify the architectures here
        }
    }

    signingConfigs {
        debug {
            keyAlias 'my-app-key'
            keyPassword 'Career@sjs10'
            storeFile file('C:/Users/soura/Downloads/codes/main/android/app/my-release-key.keystore')
            storePassword 'Career@sjs10'
        }
        // Add the release signing configuration
        release {
            keyAlias 'my-app-key'
            keyPassword 'Career@sjs10'
            storeFile file('C:/Users/soura/Downloads/codes/main/android/app/my-release-key.keystore')
            storePassword 'Career@sjs10'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release  // Use the release signing config
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.android.application'
